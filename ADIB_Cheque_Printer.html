#date span{display:inline-block;width:4.2mm;text-align:center}

</style></head><body>
<div class="noprint">
<h3>طباعة على شيك بنك أبوظبي الإسلامي</h3>
<div class="form">
<label>التاريخ</label><input id="fDate" type="date">
<label>ادفعوا إلى</label><input id="fPay" value="">
<label>المبلغ (رقم)</label><input id="fAmt" type="number" step="0.01">
<label>اللغة للتفقيط</label><select id="fLang"><option value="ar">عربي</option><option value="en">English</option></select>
<label>اسم الموقّع</label><input id="fSig">
<label>تسطير الشيك</label><input id="fCross" type="checkbox" style="justify-self:start">
<label>يصرف للمستفيد الأول</label><input id="fPayee" type="checkbox" style="justify-self:start">
<label>إزاحة أفقية مم</label><input id="fX" type="number" value="0" step="0.5">
<label>إزاحة رأسية مم</label><input id="fY" type="number" value="0" step="0.5">
<div class="cal">اطبع أول مرة على ورقة A4 عادية وحطها فوق الشيك قدام النور. لو الكلام مزاح، عدّل الإزاحة (موجب = يمين/تحت). الطباعة: Scale 100% وبدون Headers/Footers، والشيك يدخل من الدُرج اليدوي.</div>
</div>
<button onclick="window.print()">🖨️ طباعة</button>
</div>
<div id="chq">
<div id="cross" style="left:2mm;top:2mm;width:38mm;height:9mm;border-top:1.5px solid #000;border-bottom:1.5px solid #000;transform-origin:0 0;rotate:-25deg;translate:0 18mm;display:none;font-size:7.5pt;line-height:9mm;text-align:center;font-weight:bold"></div>
<div id="date"style="left:127mm;top:5mm"></div>
<div id="pay" style="left:32mm;top:22mm"></div>
<div id="w1" style="left:32mm;top:30mm;font-size:10pt"></div>
<div id="w2" style="left:10mm;top:37mm;font-size:10pt"></div>
<div id="num" style="left:132mm;top:39mm;font-size:12pt"></div>
<div id="sig" style="left:62mm;top:46mm"></div>
</div>
<script>
const $=id=>document.getElementById(id);
const onesA=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
const tensA=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
const hundA=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
function ar999(n){let p=[];if(n>=100){p.push(hundA[Math.floor(n/100)]);n%=100}
 if(n>0){if(n<20)p.push(onesA[n]);else{let o=n%10,t=Math.floor(n/10);p.push(o?onesA[o]+' و'+tensA[t]:tensA[t])}}return p.join(' و')}
function arWords(n){if(n===0)return 'صفر';const sc=[['','',''],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];
 let parts=[],i=0;while(n>0){let c=n%1000;if(c){let s;if(i==0)s=ar999(c);else if(c==1)s=sc[i][0];else if(c==2)s=sc[i][1];else if(c<=10)s=ar999(c)+' '+sc[i][2];else s=ar999(c)+' '+sc[i][0];parts.unshift(s)}n=Math.floor(n/1000);i++}
 return parts.join(' و')}
const onesE=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
const tensE=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
function en999(n){let s='';if(n>=100){s=onesE[Math.floor(n/100)]+' Hundred';n%=100;if(n)s+=' '}
 if(n<20)s+=onesE[n];else s+=tensE[Math.floor(n/10)]+(n%10?'-'+onesE[n%10]:'');return s}
function enWords(n){if(n===0)return 'Zero';const sc=['','Thousand','Million','Billion'];let p=[],i=0;
 while(n>0){let c=n%1000;if(c)p.unshift(en999(c)+(sc[i]?' '+sc[i]:''));n=Math.floor(n/1000);i++}return p.join(' ')}
function words(a,lang){const d=Math.floor(a),f=Math.round((a-d)*100);
 if(lang=='ar')return arWords(d)+' جنيه مصري'+(f?' و'+arWords(f)+' قرش':'')+' فقط لا غير';
 return 'EGP '+enWords(d)+' Egyptian Pounds'+(f?' and '+f+'/100 Piastres':'')+' Only'}
function split(t,max){if(t.length<=max)return[t,''];let i=t.lastIndexOf(' ',max);if(i<0)i=max;return[t.slice(0,i),t.slice(i+1)]}
function render(){
 const d=$('fDate').value;$('date').innerHTML=d?d.split('-').reverse().join('').split('').map(c=>'<span>'+c+'</span>').join(''):'';
 $('pay').textContent=$('fPay').value;
 const a=parseFloat($('fAmt').value);
 if(a>0){const w=words(a,$('fLang').value),[l1,l2]=split(w,48);$('w1').textContent=l1;$('w2').textContent=l2;
  $('num').textContent='**'+a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})+'**';}
 else{$('w1').textContent=$('w2').textContent=$('num').textContent=''}
 $('sig').textContent=$('fSig').value;
 const c=$('fCross').checked,p=$('fPayee').checked,x=$('cross');
 x.style.display=(c||p)?'block':'none';x.style.borderColor=c?'#000':'transparent';
 x.textContent=p?'يصرف للمستفيد الأول A/C Payee Only':'';
 const lang=$('fLang').value,isAr=t=>/[؀-ۿ]/.test(t);
 // Arabic text starts from the right, next to the Arabic label; English starts from the left
 const pos={pay:[32,69],w1:[32,70],w2:[10,10]};
 for(const k in pos){const e=$(k),rtl=k=='pay'?isAr(e.textContent):lang=='ar';
  e.style.direction=rtl?'rtl':'ltr';e.style.left=rtl?'auto':pos[k][0]+'mm';e.style.right=rtl?pos[k][1]+'mm':'auto';}
 document.querySelectorAll('#chq>div').forEach(e=>e.style.transform=`translate(${$('fX').value}mm,${$('fY').value}mm)`);
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',render));
$('fDate').valueAsDate=new Date();render();
</script></body></html>
